# ODR bot bans: the theme's minimal 404 -- a url that isn't a valid search at all.
#
# Only these count, not every 404: a real visitor reading a page with broken images produces
# ordinary 404s, but never gate=minimal_404.  The jail sets how many in how long.

[Definition]
failregex = ^<HOST> \S+ \S+ [^"]*"(?:[^"\\]|\\.)*" 404 .* gate=minimal_404(?:\s|$)
ignoreregex =
