# ODR bot bans: the search gate's reCAPTCHA challenge was served.
#
# Exactly gate=challenge -- not challenge-stale-form, and not challenge-google-unreachable,
# which is our outage rather than the visitor's fault.  A visitor who solves the challenge is
# trusted for the gate's ban length and isn't challenged again, so a pile of these means
# something that keeps asking and never answers.

[Definition]
failregex = ^<HOST> \S+ \S+ [^"]*"(?:[^"\\]|\\.)*" 403 .* gate=challenge(?:\s|$)
ignoreregex =
