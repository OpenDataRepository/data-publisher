# ODR bot bans: any 410 Gone is an immediate ban.
#
# Apache sends 410 only from the bot-ban rules (gate=attack, gate=banned-bot), before PHP runs,
# so one is enough.  Matches the combined_gate log format:
#   %h %l %u %t "%r" %>s %O "%{Referer}i" "%{User-Agent}i" gate=%{X-ODR-Gate}o

[Definition]
failregex = ^<HOST> \S+ \S+ [^"]*"(?:[^"\\]|\\.)*" 410 
ignoreregex =
