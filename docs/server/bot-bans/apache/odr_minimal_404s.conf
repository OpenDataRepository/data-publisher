# ODR minimal 404s: Apache side.  See BAN_SYSTEM.md.
#
# The WordPress theme (odr-astra-child-theme, functions.php) answers these urls with its minimal
# 404, tagged gate=minimal_404 -- but only after Apache has started PHP and WordPress has loaded.
# These rules answer the same urls from Apache, with the same tag, so the bots requesting them
# never start WordPress.  fail2ban's odr-minimal404 jail counts them exactly as before.
#
# Include it in the rruff <VirtualHost> (both :443 and :80), after odr-bot-bans.conf:
#     Include /etc/apache2/conf-available/odr-bot-bans.conf
#     Include /etc/apache2/conf-available/odr_minimal_404s.conf
#
# NOTE: these run before WordPress, for EVERY request -- so unlike the theme, they can't tell a
#  real WordPress page from a bot.  Only rules no real page or file can match are here.  The
#  theme keeps the rest (any other multi-segment url, a query string on a root url,
#  sitemap-misc.xml, root .txt/.xml/.html/.json files), and stays the fallback for all of these.
# NOTE: the vhost must not have an "ErrorDocument 404" pointing into WordPress, or each of these
#  404s would start WordPress after all.
# Needs mod_rewrite and mod_headers.

RewriteEngine On

# ---------------------------------------------------------------------------------- legacy urls

# /constructor.php without a usable txt_mineral (the theme redirects the ones that have one)
RewriteCond %{QUERY_STRING} !(^|&)txt_mineral=[^&$<] [NC]
RewriteRule ^/constructor\.php$ - [R=404,L,E=odr_gate:minimal_404]

# constructor.php anywhere but the root: /rruff/new_rruff/constructor.php, /foo/constructor.php
RewriteRule ^/.+/constructor\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# /r/<anything> and /export<n>/<anything> -- RRUFF ids are only searched at the root, /<id>
RewriteRule ^/r/ - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteRule ^/export\d+/ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old sample search, /index.php/r=sample_search/... and /index.php?...r=sample_search...
# NOTE: only the RRUFF queries -- WordPress itself answers other /index.php?... urls
RewriteRule ^/index\.php/r=sample_search - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteCond %{QUERY_STRING} (^|&)(r=sample_search|new_sample_search=|txt_mineral=) [NC]
RewriteRule ^/index\.php$ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old reference search
RewriteRule ^/rruff_1\.0/reference_search\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# Retired document library sections -- unless the file really exists
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/doclib/(MinMag|mj|jmps|mm|zk)(/|$) - [NC,R=404,L,E=odr_gate:minimal_404]

# ------------------------------------------------------------------------------------ bot shapes

# A file at the root that doesn't exist: /apple-touch-icon.png, /wp-config.php.bak.php, /x.js ...
# No mineral name or RRUFF id has a file extension.  Left to WordPress: favicon.ico (it answers
# with the site icon) and /constructor.php with a mineral name (the theme redirects it).
RewriteCond %{REQUEST_URI} !^/(favicon\.ico|constructor\.php)$ [NC]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/[^/]+\.(ico|png|jpe?g|gif|svg|webp|css|js|map|woff2?|ttf|eot|php)$ - [NC,R=404,L,E=odr_gate:minimal_404]

# A deeper path ending in a RRUFF id: /_/R060867, /it/R060130, /-/chemistry/asc/R060063.  The
# only valid form is /<id> at the root.
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/.+/[RXD]\d{6}/?$ - [NC,R=404,L,E=odr_gate:minimal_404]

# An "=" in the path itself (not the query string): the old rruff.info style /chem=Pb/display=default/R060055
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/[^?]*= - [R=404,L,E=odr_gate:minimal_404]

# ------------------------------------------------------------------------------------------------

# Puts the reason in the X-ODR-Gate header the log format reads ("always": a 404 is an error
# response).  Same line as in odr-bot-bans.conf; having it twice is harmless.
Header always set X-ODR-Gate "%{odr_gate}e" env=odr_gate
