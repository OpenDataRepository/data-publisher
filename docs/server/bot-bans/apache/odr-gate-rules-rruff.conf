# ODR gate: rules for the RRUFF site only.  See BAN_SYSTEM.md.
#
# Install to /etc/apache2/conf-available/ (don't a2enconf it).  Used by a vhost with:
#     Use OdrGate <instance> rruff
# The macro in odr-gate.conf pulls this in after the banned-bot rule and before the api /
# crawler / cookie checks, so these apply to everyone except the free-pass addresses.

# The Bustamite flood: /<Mineral>?sample_child_id=..., plus the follow-up requests (favicon.ico and
# so on) that carry it as their Referer.  Never a working search.
RewriteCond %{QUERY_STRING} (^|&)sample_child_id= [NC,OR]
RewriteCond %{HTTP_REFERER} [?&]sample_child_id= [NC]
RewriteRule ^/[^/]+$ - [G,L,E=odr_gate:attack]

# ---------------------------------------------------------------------------------- minimal 404

# The same urls the WordPress theme answers with its minimal 404, answered here instead so
# WordPress never starts for them.  Only patterns no real page or file can match: the theme still
# handles the rest (any other multi-segment url, a query string on a root url, sitemap-misc.xml,
# root .txt/.xml/.html/.json), and stays the fallback for these.

# /constructor.php without a usable txt_mineral (the theme redirects the ones that have one)
RewriteCond %{QUERY_STRING} !(^|&)txt_mineral=[^&$<] [NC]
RewriteRule ^/constructor\.php$ - [R=404,L,E=odr_gate:minimal_404]

# constructor.php anywhere but the root: /rruff/new_rruff/constructor.php, /foo/constructor.php
RewriteRule ^/.+/constructor\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# /r/<anything> and /export<n>/<anything> -- RRUFF ids are only searched at the root, /<id>
RewriteRule ^/r/ - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteRule ^/export\d+/ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old sample search.  NOTE: only the RRUFF queries -- WordPress answers other /index.php?...
RewriteRule ^/index\.php/r=sample_search - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteCond %{QUERY_STRING} (^|&)(r=sample_search|new_sample_search=|txt_mineral=) [NC]
RewriteRule ^/index\.php$ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old reference search
RewriteRule ^/rruff_1\.0/reference_search\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# Retired document library sections -- unless the file really exists
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/doclib/(MinMag|mj|jmps|mm|zk)(/|$) - [NC,R=404,L,E=odr_gate:minimal_404]

# A file at the root that doesn't exist: /apple-touch-icon.png, /wp-config.php.bak.php, /x.js ...
# Left to WordPress: favicon.ico (the site icon) and /constructor.php with a mineral name.
RewriteCond %{REQUEST_URI} !^/(favicon\.ico|constructor\.php)$ [NC]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/[^/]+\.(ico|png|jpe?g|gif|svg|webp|css|js|map|woff2?|ttf|eot|php)$ - [NC,R=404,L,E=odr_gate:minimal_404]

# A deeper path ending in a RRUFF id: /_/R060867, /it/R060130 -- the only valid form is /<id>
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/.+/[RXD]\d{6}/?$ - [NC,R=404,L,E=odr_gate:minimal_404]

# An "=" in the path itself (not the query string): /chem=Pb/display=default/R060055
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/[^?]*= - [R=404,L,E=odr_gate:minimal_404]
