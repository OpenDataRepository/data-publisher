# ODR gate: everything Apache does before a request reaches WordPress or ODR.  See BAN_SYSTEM.md.
#
# Enabled once for the whole server (it defines things, it doesn't act on its own):
#     cp odr-gate.conf /etc/apache2/conf-available/ && a2enconf odr-gate
# Then each site's <VirtualHost> (both :443 and :80) turns the gate on with one line:
#     Use OdrGate <ODR instance directory> <rule set>
#     Use OdrGate /home/rruff/data-publisher rruff
#     Use OdrGate /home/odr/data-publisher   none
# The instance supplies the site's branding (app/config/gate_branding.ini).  The rule set adds
# site-specific rules from /etc/apache2/conf-available/odr-gate-rules-<name>.conf ("none" adds
# nothing).
#
# It reads two other files:
#     /etc/apache2/odr-gate-local.conf     this server's settings: secret, shared gate.ini, the gate
#                                          directory, the free-pass addresses (required)
#     /etc/apache2/odr-gate-crawlers.conf  generated by odr-gate-update-crawlers (optional: without
#                                          it no crawler is recognised)
#
# In order, for every request to a site using the gate:
#   1. Free pass       localhost and this server's own addresses: nothing below applies.
#                      Covers the static render daemon and WordPress's own loopback requests.
#   2. 410             banned bots by user agent (every site), plus the site's own rule set
#                      (rruff: the Bustamite flood, and 404s for urls no real page can match).
#                      An approved crawler's refusals are logged approved_404 / approved_410,
#                      which fail2ban ignores.
#   3. Straight through  /api/v<n> and /<word>/api/v<n> routes, and approved crawlers (Google,
#                      Bing, DuckDuckGo, by published address).
#   4. Straight through  a visitor with a valid pass cookie: solved the reCAPTCHA, on this site,
#                      from this address, recently.
#   5. Everything else gets the reCAPTCHA (gate/challenge.php -- no WordPress, no ODR), branded
#                      for the site.  Logged gate=challenge; fail2ban bans after 10 in 24 hours.
#
# Logging: each site keeps its own access log, untouched.  The gate also writes its events
# (challenges, solves, junk-url 404s, 410s) from every site into one shared file,
# ${APACHE_LOG_DIR}/odr-ban-monitor.log, which is the only log fail2ban reads.  Ordinary traffic,
# passed visitors included, isn't written there.
#
# Needs mod_macro, mod_rewrite, mod_headers, mod_setenvif, mod_alias and mod_env.
# A vhost using the gate must not have an "ErrorDocument 404" or "ErrorDocument 410" pointing
# into WordPress.

# Server-wide: settings, the free-pass and crawler lists (every vhost inherits these)
Include /etc/apache2/odr-gate-local.conf
IncludeOptional /etc/apache2/odr-gate-crawlers.conf

# The shared ban-monitor log's format: the combined format (which the fail2ban filters expect),
# then the gate's reason and the site
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" gate=%{X-ODR-Gate}o site=%v" odr_ban_monitor

# The challenge script, served straight from the shared ODR code
<Directory "${ODR_GATE_DIR}">
    Require all granted
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(?!challenge\.php$)">
        Require all denied
    </FilesMatch>
</Directory>


<Macro OdrGate $instance $rules>
    # Which ODR instance this site belongs to (its branding), and the shared gate settings
    SetEnv odr_gate_site "$instance"
    SetEnv odr_gate_config "${ODR_GATE_CONFIG}"
    Alias /odr-gate/ "${ODR_GATE_DIR}/"

    # This site's gate events, into the shared monitor log fail2ban reads (in addition to the
    #  site's own access log).  Only what bans are decided on, and what's useful to see beside it.
    CustomLog ${APACHE_LOG_DIR}/odr-ban-monitor.log odr_ban_monitor "expr=resp('X-ODR-Gate') =~ /^(challenge|solved|minimal_404|approved_|attack|banned-bot|gate-misconfigured)/"

    RewriteEngine On

    # The decision is made once, on the request as it arrived.  WordPress and ODR re-dispatch
    # pretty urls internally (to index.php / app.php), which runs these rules again with every
    # variable renamed REDIRECT_* -- skip those, or a crawler would be "unrecognised" the second
    # time round.
    RewriteCond %{ENV:REDIRECT_STATUS} .
    RewriteRule ^ - [L]

    # --------------------------------------------------------------------------- 1. free pass

    RewriteCond %{ENV:odr_trusted} =1
    RewriteRule ^ - [L,E=odr_gate_via:trusted]

    # Never gated: the gate itself (the page, its logo), and certificate renewals
    RewriteRule ^/odr-gate/ - [L]
    RewriteRule ^/\.well-known/acme-challenge/ - [L]

    # --------------------------------------------------------------------------------- 2. 410

    # Banned bots, by user agent, on every site.  To ban another, add its name:
    #     (Amazonbot|Bytespider|PetalBot)
    RewriteCond %{HTTP_USER_AGENT} (Amazonbot) [NC]
    RewriteRule ^ - [G,L,E=odr_gate:banned-bot]

    # This site's own rules (odr-gate-rules-<rule set>.conf)
    IncludeOptional /etc/apache2/conf-available/odr-gate-rules-$rules.conf

    # ------------------------------------------------------------------- 3. straight through

    # Exceptions: specific urls that skip the reCAPTCHA (bans and 410s above still apply).
    # Matched on the path only -- any query string is allowed and ignored.  Logged
    # gate=exception_granted.  To add one, copy a line.
    RewriteRule ^/AMS/jsmol_search\.php$ - [L,E=odr_gate_via:exception_granted]

    # API routes: lightweight, and the queries among them need a token anyway.  The prefix
    # allows "_": ODR is served under /odr_rruff, and /odr_rruff/api/v4/... is the API too.
    RewriteRule ^/(?:[A-Za-z0-9_-]+/)?api/v[0-9] - [L,E=odr_gate_via:api]

    # Approved crawlers (odr-gate-crawlers.conf)
    RewriteCond %{ENV:odr_crawler} =1
    RewriteRule ^ - [L,E=odr_gate_via:crawler]

    # ------------------------------------------------------------------------ 4. pass cookie

    # odr_pass=<expiry YYYYMMDDHHMMSS>-<sha1 of "expiry-address-host-secret">, set by
    # challenge.php.  Only good on the site that issued it, from the address that solved it,
    # until it expires.
    RewriteCond expr "%{HTTP_COOKIE} =~ /(?:^|;\s*)odr_pass=([0-9]{14})-([0-9a-f]{40})/ && $1 -gt %{TIME} && sha1('$1-%{REMOTE_ADDR}-%{HTTP_HOST}-${ODR_GATE_SECRET}') == $2"
    RewriteRule ^ - [L,E=odr_gate_via:passed]

    # ---------------------------------------------------------------------- 5. the challenge

    # A browser asks for favicon.ico on its own; answering that with a challenge would count
    # against the visitor in fail2ban, so it gets a plain 404 until they've passed.
    RewriteRule ^/favicon\.ico$ - [R=404,L]

    # Everything else.  The script sees the original url in REQUEST_URI; odr_gate_now hands it
    # Apache's clock, so the cookie expiry it writes is in the same terms as %{TIME} above.
    RewriteRule ^ /odr-gate/challenge.php [PT,L,E=odr_gate_now:%{TIME}]

    # ------------------------------------------------------------------------------ logging

    # The reason, in the X-ODR-Gate header the log format reads.  "always" covers error
    # responses (the 404s and 410s).  An approved crawler's refusals are logged approved_404 /
    # approved_410 instead, which fail2ban doesn't count: Google still gets the 404, but isn't
    # banned.
    Header always set X-ODR-Gate "%{odr_gate}e" env=odr_gate
    Header always set X-ODR-Gate approved_404 "expr=reqenv('odr_gate') == 'minimal_404' && reqenv('odr_crawler') == '1'"
    Header always set X-ODR-Gate approved_410 "expr=reqenv('odr_gate') =~ /^(attack|banned-bot)$/ && reqenv('odr_crawler') == '1'"

    # How a request that went through was let through (trusted, api, crawler, passed) -- unless
    # WordPress, ODR or the challenge script already said something more specific.  After an
    # internal re-dispatch the variable is called REDIRECT_odr_gate_via, hence both lines.
    Header setifempty X-ODR-Gate "%{odr_gate_via}e" env=odr_gate_via
    Header setifempty X-ODR-Gate "%{REDIRECT_odr_gate_via}e" env=REDIRECT_odr_gate_via
</Macro>
