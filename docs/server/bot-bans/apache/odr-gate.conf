# ODR gate: everything Apache does before a request reaches WordPress or ODR.  See BAN_SYSTEM.md.
#
# Include it once in each rruff <VirtualHost> (both :443 and :80):
#     Include /etc/apache2/conf-available/odr-gate.conf
#
# It reads two other files, which must exist:
#     /etc/apache2/odr-gate-local.conf     this server's settings: the ODR instance, secret, the
#                                          free-pass addresses (from odr-gate-local.conf.example)
#     /etc/apache2/odr-gate-crawlers.conf  generated by odr-gate-update-crawlers (optional: without
#                                          it no crawler is recognised)
#
# In order, for every request:
#   1. Free pass       localhost and this server's own addresses: nothing below applies.
#                      Covers the static render daemon and WordPress's own loopback requests.
#   2. 410             banned bots by user agent, the Bustamite?sample_child_id flood.
#                      Logged gate=banned-bot / gate=attack, and fail2ban bans on the first one.
#   3. Minimal 404     urls no real page can match (old RRUFF urls, bot-shaped paths).
#                      Logged gate=minimal_404 (fail2ban bans after 5 an hour) -- or, for an
#                      approved crawler, gate=approved_404, which fail2ban ignores.
#   4. Straight through  /api/v<n> and /<word>/api/v<n> routes, and approved crawlers (Google,
#                      Bing, DuckDuckGo, by published address).
#   5. Straight through  a visitor with a valid pass cookie: one who solved the reCAPTCHA, on
#                      this address, recently.
#   6. Everything else gets the reCAPTCHA (gate/challenge.php -- no WordPress, no ODR).
#                      Logged gate=challenge; fail2ban bans after 5 an hour without solving.
#
# Needs mod_rewrite, mod_headers, mod_setenvif, mod_alias and mod_env, and the access log in the
# combined_gate format:
#     LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" gate=%{X-ODR-Gate}o" combined_gate
# The vhost must not have an "ErrorDocument 404" or "ErrorDocument 410" pointing into WordPress.

Include /etc/apache2/odr-gate-local.conf
IncludeOptional /etc/apache2/odr-gate-crawlers.conf

# The challenge script, served straight from the ODR repository
Alias /odr-gate/ "${ODR_GATE_DIR}/"
<Directory "${ODR_GATE_DIR}">
    Require all granted
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(?!challenge\.php$)">
        Require all denied
    </FilesMatch>
</Directory>

RewriteEngine On

# The decision is made once, on the request as it arrived.  WordPress and ODR re-dispatch pretty
# urls internally (to index.php / app.php), which runs these rules again with every variable
# renamed REDIRECT_* -- skip those, or a crawler would be "unrecognised" the second time round.
RewriteCond %{ENV:REDIRECT_STATUS} .
RewriteRule ^ - [L]

# ------------------------------------------------------------------------------- 1. free pass

RewriteCond %{ENV:odr_trusted} =1
RewriteRule ^ - [L,E=odr_gate_via:trusted]

# Never gated: the gate itself, and certificate renewals
RewriteRule ^/odr-gate/ - [L]
RewriteRule ^/\.well-known/acme-challenge/ - [L]

# ------------------------------------------------------------------------------------- 2. 410

# Banned bots, by user agent.  To ban another, add its name: (Amazonbot|Bytespider|PetalBot)
RewriteCond %{HTTP_USER_AGENT} (Amazonbot) [NC]
RewriteRule ^ - [G,L,E=odr_gate:banned-bot]

# The Bustamite flood: /<Mineral>?sample_child_id=..., plus the follow-up requests (favicon.ico and
# so on) that carry it as their Referer.  Never a working search.
RewriteCond %{QUERY_STRING} (^|&)sample_child_id= [NC,OR]
RewriteCond %{HTTP_REFERER} [?&]sample_child_id= [NC]
RewriteRule ^/[^/]+$ - [G,L,E=odr_gate:attack]

# ---------------------------------------------------------------------------- 3. minimal 404

# The same urls the WordPress theme answers with its minimal 404, answered here instead so
# WordPress never starts for them.  Only patterns no real page or file can match: the theme
# still handles the rest (any other multi-segment url, a query string on a root url,
# sitemap-misc.xml, root .txt/.xml/.html/.json), and stays the fallback for these.

# /constructor.php without a usable txt_mineral (the theme redirects the ones that have one)
RewriteCond %{QUERY_STRING} !(^|&)txt_mineral=[^&$<] [NC]
RewriteRule ^/constructor\.php$ - [R=404,L,E=odr_gate:minimal_404]

# constructor.php anywhere but the root: /rruff/new_rruff/constructor.php, /foo/constructor.php
RewriteRule ^/.+/constructor\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# /r/<anything> and /export<n>/<anything> -- RRUFF ids are only searched at the root, /<id>
RewriteRule ^/r/ - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteRule ^/export\d+/ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old sample search.  NOTE: only the RRUFF queries -- WordPress answers other /index.php?...
RewriteRule ^/index\.php/r=sample_search - [NC,R=404,L,E=odr_gate:minimal_404]
RewriteCond %{QUERY_STRING} (^|&)(r=sample_search|new_sample_search=|txt_mineral=) [NC]
RewriteRule ^/index\.php$ - [NC,R=404,L,E=odr_gate:minimal_404]

# The old reference search
RewriteRule ^/rruff_1\.0/reference_search\.php - [NC,R=404,L,E=odr_gate:minimal_404]

# Retired document library sections -- unless the file really exists
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/doclib/(MinMag|mj|jmps|mm|zk)(/|$) - [NC,R=404,L,E=odr_gate:minimal_404]

# A file at the root that doesn't exist: /apple-touch-icon.png, /wp-config.php.bak.php, /x.js ...
# Left to WordPress: favicon.ico (the site icon) and /constructor.php with a mineral name.
RewriteCond %{REQUEST_URI} !^/(favicon\.ico|constructor\.php)$ [NC]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteRule ^/[^/]+\.(ico|png|jpe?g|gif|svg|webp|css|js|map|woff2?|ttf|eot|php)$ - [NC,R=404,L,E=odr_gate:minimal_404]

# A deeper path ending in a RRUFF id: /_/R060867, /it/R060130 -- the only valid form is /<id>
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/.+/[RXD]\d{6}/?$ - [NC,R=404,L,E=odr_gate:minimal_404]

# An "=" in the path itself (not the query string): /chem=Pb/display=default/R060055
RewriteCond %{REQUEST_URI} !^/(odr|wp-) [NC]
RewriteRule ^/[^?]*= - [R=404,L,E=odr_gate:minimal_404]

# ---------------------------------------------------------------------- 4. straight through

# API routes: lightweight, and the queries among them need a token anyway.  The prefix allows
# "_": ODR is served under /odr_rruff, and /odr_rruff/api/v4/... is the API too.
RewriteRule ^/(?:[A-Za-z0-9_-]+/)?api/v[0-9] - [L,E=odr_gate_via:api]

# Approved crawlers (odr-gate-crawlers.conf)
RewriteCond %{ENV:odr_crawler} =1
RewriteRule ^ - [L,E=odr_gate_via:crawler]

# ------------------------------------------------------------------------ 5. pass cookie

# odr_pass=<expiry YYYYMMDDHHMMSS>-<sha1 of "expiry-address-secret">, set by challenge.php.  Only
# good from the address that solved it, until it expires.
RewriteCond expr "%{HTTP_COOKIE} =~ /(?:^|;\s*)odr_pass=([0-9]{14})-([0-9a-f]{40})/ && $1 -gt %{TIME} && sha1('$1-%{REMOTE_ADDR}-${ODR_GATE_SECRET}') == $2"
RewriteRule ^ - [L,E=odr_gate_via:passed]

# ------------------------------------------------------------------------- 6. the challenge

# A browser asks for favicon.ico on its own; answering that with a challenge would count against
# the visitor in fail2ban, so it gets a plain 404 until they've passed.
RewriteRule ^/favicon\.ico$ - [R=404,L]

# Everything else.  The script sees the original url in REQUEST_URI; odr_gate_now hands it
# Apache's clock, so the cookie expiry it writes is in the same terms as %{TIME} above.
RewriteRule ^ /odr-gate/challenge.php [PT,L,E=odr_gate_now:%{TIME}]

# ------------------------------------------------------------------------------- logging

# The reason, in the X-ODR-Gate header the log format reads.  "always" covers error responses
# (the 404s and 410s above).  An approved crawler's refusals are logged approved_404 /
# approved_410 instead, which fail2ban doesn't count: Google still gets the 404, but isn't banned.
Header always set X-ODR-Gate "%{odr_gate}e" env=odr_gate
Header always set X-ODR-Gate approved_404 "expr=reqenv('odr_gate') == 'minimal_404' && reqenv('odr_crawler') == '1'"
Header always set X-ODR-Gate approved_410 "expr=reqenv('odr_gate') =~ /^(attack|banned-bot)$/ && reqenv('odr_crawler') == '1'"

# How a request that went through was let through (trusted, api, crawler, passed) -- unless
# WordPress or the challenge script already said something more specific.  After WordPress's
# internal re-dispatch the variable is called REDIRECT_odr_gate_via, hence both lines.
Header setifempty X-ODR-Gate "%{odr_gate_via}e" env=odr_gate_via
Header setifempty X-ODR-Gate "%{REDIRECT_odr_gate_via}e" env=REDIRECT_odr_gate_via
