# ODR bot bans: Apache side.  See BAN_SYSTEM.md.
#
# Include this inside the rruff <VirtualHost> (the :443 one, and :80 too if it serves the site
# rather than redirecting):
#     Include /etc/apache2/conf-available/odr-bot-bans.conf
#
# Everything here answers 410 Gone before PHP starts, tagged in the access log as gate=<reason>.
# fail2ban's odr-410 jail bans the address at the firewall on the first one, for 48 hours.
# Needs mod_rewrite and mod_headers, and the access log in the combined_gate format:
#     LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" gate=%{X-ODR-Gate}o" combined_gate

RewriteEngine On

# 1. Banned bots, by user agent.  To ban another, add its name to the list, e.g.
#        (Amazonbot|Bytespider|PetalBot)
#    A bot that publishes its addresses can also go in odr:banned_bot_ips:update, which bans
#    those addresses before they ever connect.
RewriteCond %{HTTP_USER_AGENT} (Amazonbot) [NC]
RewriteRule ^ - [G,L,E=odr_gate:banned-bot]

# 2. The Bustamite flood: /<Mineral>?sample_child_id=..., plus the follow-up requests (favicon.ico
#    and so on) that carry it as their Referer.  Never a working search.
RewriteCond %{QUERY_STRING} (^|&)sample_child_id= [NC,OR]
RewriteCond %{HTTP_REFERER} [?&]sample_child_id= [NC]
RewriteRule ^/[^/]+$ - [G,L,E=odr_gate:attack]

# Puts the reason in the X-ODR-Gate header the log format reads.  "always" is needed for it to
# apply to an error response like the 410.
Header always set X-ODR-Gate "%{odr_gate}e" env=odr_gate
